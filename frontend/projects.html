
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự án của tôi | Pulse Track</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/projects.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="auth-checking">

    <div id="auth-guard-message" role="status" aria-live="polite">
        Đang kiểm tra phiên đăng nhập...
    </div>

    <button id="auth-guard-retry" type="button" hidden>
        Thử lại
    </button>

    <div id="app-error-message" role="alert" hidden></div>

    <header class="app-header">
        <a href="dashboard.html" class="brand">
            <span class="pulse">⌁</span>
            Pulse Track
        </a>

        <nav>
            <a href="dashboard.html">Tổng quan</a>
            <a href="projects.html">Dự án</a>
            <a href="kanban.html">Kanban</a>
            <a href="profile.html" data-user-name>Tài khoản</a>
            <button type="button" class="logout-button" data-logout>
                Đăng xuất
            </button>
        </nav>
    </header>

    <main class="content">
        <div class="page-head">
            <div>
                <span class="eyebrow">QUẢN LÝ DỰ ÁN</span>
                <h1>Dự án của tôi</h1>
                <p class="muted">Các dự án bạn đang tham gia.</p>
            </div>
            <button type="button" id="btn-new-project" class="btn btn-primary">+ Tạo dự án</button>
        </div>

        <div class="toolbar">
            <label for="filter-status">Hiển thị</label>
            <select id="filter-status">
                <option value="active">Đang hoạt động</option>
                <option value="archived">Đã lưu trữ</option>
                <option value="all">Tất cả</option>
            </select>
        </div>

        <div id="project-list" class="project-grid" aria-live="polite"></div>
    </main>

    <script defer src="js/config.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/router.js"></script>
    <script defer src="js/projects.js"></script>
</body>
</html>
