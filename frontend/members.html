<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thành viên dự án | Pulse Track</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/projects.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/members.css">
</head>
<body>


<header class="app-header">
    <a href="dashboard.html" class="brand">
        <span class="pulse">⌁</span>
        Pulse Track
    </a>

    <nav aria-label="Điều hướng chính">
        <a href="dashboard.html">
            Tổng quan
        </a>

        <a href="projects.html" aria-current="page">
            Dự án
        </a>

        <a href="kanban.html">
            Quản lý công việc
        </a>

        <a href="profile.html" data-user-name>
            Tài khoản
        </a>

        <button
            type="button"
            class="logout-button"
            data-logout
        >
            Đăng xuất
        </button>
    </nav>
</header>


    <main class="content">
        <a class="back" href="projects.html">← Danh sách dự án</a>

        <div class="page-head">
            <div>
                <span class="eyebrow">QUẢN LÝ DỰ ÁN</span>
                <h1 id="members-title">Thành viên dự án</h1>
                <p class="muted" id="members-subtitle">Đang tải...</p>
            </div>
        </div>

        <div id="members-banner" class="form-banner" hidden></div>

        <section id="add-member-box" class="card" hidden>
            <h3 class="members-h">Thêm thành viên</h3>
            <form id="add-member-form" class="members-add" novalidate>
                <label class="members-grow">Email tài khoản
                    <input type="email" name="email" placeholder="ban@example.com" autocomplete="off" required>
                    <span class="field-error" data-err="email"></span>
                </label>
                <label>Vai trò
                    <select name="role">
                        <option value="MEMBER">MEMBER</option>
                        <option value="VIEWER">VIEWER</option>
                    </select>
                </label>
                <label class="members-description">Mô tả chức vụ (không bắt buộc)
                    <textarea name="job_description" maxlength="500" rows="2" placeholder="Ví dụ: Phụ trách giao diện Frontend"></textarea>
                </label>
                <button type="submit" class="btn btn-primary">Thêm</button>
            </form>
        </section>

        <div class="scroll-x">
            <table class="members-table" id="members-table">
                <thead>
                    <tr><th>Thành viên</th><th>Email</th><th>Vai trò</th><th>Mô tả chức vụ</th><th>Tham gia</th><th></th></tr>
                </thead>
                <tbody id="members-body"></tbody>
            </table>
        </div>
    </main>

    <script defer src="js/config.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/router.js"></script>
    <script defer src="js/members.js"></script>
</body>
</html>
